<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Flip‑Card Registration with Cloud Storage</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f4f8;
        font-family: sans-serif;
      }

      /* Logo sizing and spacing */
      .logo {
        max-width: 300px; /* adjust to taste */
        height: auto;
        margin-bottom: 16px;
        display: block;
      }

      #registerBtn {
        position: absolute;
        top: 85%;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        background: #444;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .flip-container {
        width: 320px;
        height: 420px;
        perspective: 1000px;
      }
      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s ease;
        cursor: pointer;
      }
      .flipped .card {
        transform: rotateY(180deg);
      }
      .card-face {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding: 30px;
        backface-visibility: hidden;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .front {
        background: linear-gradient(135deg, #ed6d6d, #b02121);
        color: #fff;
      }
      .back {
        background: #fff;
        transform: rotateY(180deg);
      }
      .close-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        font-size: 24px;
        cursor: pointer;
        color: #666;
        z-index: 2;
      }
      .back input {
        width: 100%;
        margin: 8px 0;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .back button {
        margin-top: 12px;
        padding: 10px 20px;
        background: #b02121;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Export button
    <button id="exportBtn">Export Registrations</button>-->

    <!-- Flip‑card container -->
    <div class="flip-container" id="flipContainer">
      <div class="card">
        <!-- Front face -->
        <div class="card-face front" id="frontFace">
          <img
            src="https://images.quicket.co.za/0636145_0.jpeg"
            alt="Absa Logo"
            class="logo"
          />
          <h2>Open a Bright Future!</h2>
          <p>
            <center>
              Register to be contacted about our kids’ accounts and enter the
              competition!
            </center>
          </p>
          <button id="registerBtn">Click Here</button>
        </div>
        <!-- Back face -->
        <div class="card-face back">
          <div class="close-btn" id="closeBtn">&times;</div>
          <form id="regForm">
            <input type="text" name="parent" placeholder="Your Name" required />
            <input
              type="tel"
              name="phone"
              placeholder="Phone Number"
              required
            />
            <input
              type="email"
              name="email"
              placeholder="Email Address"
              required
            />
            <input type="text" name="kids" placeholder="Kids’ Names" required />
            <button type="submit">Submit</button>
          </form>
          <div id="thankYou" style="display: none; text-align: center">
            <h3>Thank You!</h3>
            <p>Registration received.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
      // Initialize Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyB-Nd4jqzD_4kGRl8v6ia9zILeRLkkNEvU",
        authDomain: "registeryourfuture.firebaseapp.com",
        databaseURL: "https://registeryourfuture-default-rtdb.firebaseio.com",
        projectId: "registeryourfuture",
        storageBucket: "registeryourfuture.firebasestorage.app",
        messagingSenderId: "697117686663",
        appId: "1:697117686663:web:47855382fa03b2b9b13122",
        measurementId: "G-Z6LGLVMB6D",
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      // UI references
      const container = document.getElementById("flipContainer");
      const form = document.getElementById("regForm");
      const closeBtn = document.getElementById("closeBtn");
      const thankYou = document.getElementById("thankYou");
      const exportBtn = document.getElementById("exportBtn");

      // Flip to form
      container.addEventListener("click", () => {
        if (!container.classList.contains("flipped")) {
          container.classList.add("flipped");
        }
      });
      // Close form
      closeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        container.classList.remove("flipped");
      });

      // Handle submit: push to RTDB
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const entry = {
          parent: form.parent.value,
          phone: form.phone.value,
          email: form.email.value,
          kids: form.kids.value,
          timestamp: new Date().toISOString(),
        };
        db.ref("registrations").push(entry);
        form.style.display = "none";
        thankYou.style.display = "block";
        setTimeout(() => {
          container.classList.remove("flipped");
          form.reset();
          form.style.display = "block";
          thankYou.style.display = "none";
        }, 2000);
      });

      // Export with password prompt
      exportBtn.addEventListener("click", () => {
        const pw = prompt("Enter password to export:");
        if (pw !== "passwordtemp") {
          alert("Incorrect password");
          return;
        }
        db.ref("registrations")
          .once("value")
          .then((snapshot) => {
            const data = snapshot.val() || {};
            const arr = Object.values(data);
            if (!arr.length) {
              alert("No registrations to export");
              return;
            }
            const headers = Object.keys(arr[0]);
            const rows = arr.map((obj) =>
              headers
                .map((h) => `"${(obj[h] || "").replace(/"/g, '""')}"`)
                .join(",")
            );
            const csv = [headers.join(","), ...rows].join("\r\n");
            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "registrations.csv";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          });
      });
    </script>
  </body>
</html>
