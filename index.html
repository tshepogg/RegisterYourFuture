<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Flip‑Card Registration</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f0f4f8;
        font-family: sans-serif;
      }
      .flip-container {
        width: 320px;
        height: 420px;
        perspective: 1000px;
      }
      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s ease;
        cursor: pointer;
      }
      .flipped .card {
        transform: rotateY(180deg);
      }
      .card-face {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 30px;
      }
      .front {
        background: linear-gradient(135deg, #6dd5ed, #2193b0);
        color: white;
      }
      .back {
        background: white;
        transform: rotateY(180deg);
      }
      .close-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        font-size: 24px;
        cursor: pointer;
        color: #666;
        z-index: 2;
      }
      .back input {
        width: 100%;
        margin: 8px 0;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      .back button {
        margin-top: 12px;
        padding: 10px 20px;
        background: #2193b0;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="flip-container" id="flipContainer">
      <div class="card">
        <div class="card-face front" id="frontFace">
          <h2>Open a Bright Future!</h2>
          <p>Click to register your kids’ accounts!</p>
        </div>
        <div class="card-face back">
          <div class="close-btn" id="closeBtn">&times;</div>
          <form id="regForm">
            <input type="text" name="parent" placeholder="Your Name" required />
            <input
              type="tel"
              name="phone"
              placeholder="Phone Number"
              required
            />
            <input
              type="email"
              name="email"
              placeholder="Email Address"
              required
            />
            <input type="text" name="kids" placeholder="Kids’ Names" required />
            <button type="submit">Submit</button>
          </form>
          <div id="thankYou" style="display: none; text-align: center">
            <h3>Thank You!</h3>
            <p>Registration received.</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      const container = document.getElementById("flipContainer");
      const form = document.getElementById("regForm");
      const thankYou = document.getElementById("thankYou");
      const closeBtn = document.getElementById("closeBtn");

      // 1) Flip **on any click** in the front half
      container.addEventListener("click", (e) => {
        // if we're already flipped, do nothing here
        if (container.classList.contains("flipped")) return;
        // otherwise, flip
        container.classList.add("flipped");
      });

      // 2) Close button to unflip
      closeBtn.addEventListener("click", (e) => {
        e.stopPropagation(); // prevent container's click
        container.classList.remove("flipped");
      });

      // 3) Submission also unflips after showing thank‑you
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        form.style.display = "none";
        thankYou.style.display = "block";
        setTimeout(() => {
          container.classList.remove("flipped");
          form.reset();
          form.style.display = "block";
          thankYou.style.display = "none";
        }, 2000);
      });
    </script>
  </body>
</html>
