<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Flip‑Card Registration</title>
    <style>
      /* Center container */
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f0f4f8;
        font-family: sans-serif;
      }
      /* Flip container with perspective */
      .flip-container {
        width: 320px;
        height: 420px;
        perspective: 1000px; /* 3D depth */
      }
      /* Inner card that flips */
      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d; /* children in 3D space */
        transition: transform 0.6s ease; /* smooth flip */
        cursor: pointer;
      }
      /* Apply flip when toggled */
      .flipped .card {
        transform: rotateY(180deg);
      }
      /* Front & back faces */
      .card-face {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        backface-visibility: hidden; /* hide rear face */
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
      }
      /* Front styling */
      .front {
        background: linear-gradient(135deg, #ed6d6d, #ff0505);
        color: white;
      }
      /* Back styling (rotated) */
      .back {
        background: white;
        transform: rotateY(180deg);
      }
      /* Form inputs */
      .back input {
        width: 100%;
        margin: 8px 0;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      /* Submit button */
      .back button {
        margin-top: 12px;
        padding: 10px 20px;
        background: #2193b0;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="flip-container" id="flipContainer">
      <div class="card">
        <!-- FRONT SIDE -->
        <div class="card-face front" id="frontFace">
          <h2>Open a Bright Future!</h2>
          <p>Click to register your kids’ accounts!</p>
        </div>

        <!-- BACK SIDE -->
        <div class="card-face back" id="backFace">
          <form id="regForm">
            <input type="text" name="parent" placeholder="Your Name" required />
            <input
              type="tel"
              name="phone"
              placeholder="Phone Number"
              required
            />
            <input
              type="email"
              name="email"
              placeholder="Email Address"
              required
            />
            <input type="text" name="kids" placeholder="Kids’ Names" required />
            <button type="submit">Submit</button>
          </form>
          <div id="thankYou" style="display: none; text-align: center">
            <h3>Thank You!</h3>
            <p>Registration received.</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      const container = document.getElementById("flipContainer");
      const form = document.getElementById("regForm");
      const thankYou = document.getElementById("thankYou");

      // Flip to back on front-click
      container.querySelector(".front").addEventListener("click", () => {
        container.classList.add("flipped");
      });

      // Handle form submit
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        form.style.display = "none";
        thankYou.style.display = "block";
        // After a delay, flip back and reset
        setTimeout(() => {
          container.classList.remove("flipped");
          form.reset();
          form.style.display = "block";
          thankYou.style.display = "none";
        }, 2000);
      });
    </script>
  </body>
</html>
