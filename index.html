<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Flip‑Card Registration</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f4f8;
        font-family: sans-serif;
      }
      .flip-container {
        width: 320px;
        height: 420px;
        perspective: 1000px;
      }
      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s ease;
        cursor: pointer;
      }
      .flipped .card {
        transform: rotateY(180deg);
      }
      .card-face {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding: 30px;
        backface-visibility: hidden;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .front {
        background: linear-gradient(135deg, #6dd5ed, #2193b0);
        color: #fff;
      }
      .back {
        background: #fff;
        transform: rotateY(180deg);
      }
      .close-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        font-size: 24px;
        cursor: pointer;
        color: #666;
        z-index: 2;
      }
      .back input {
        width: 100%;
        margin: 8px 0;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      .back button {
        margin-top: 12px;
        padding: 10px 20px;
        background: #2193b0;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      /* Export button styling */
      #exportBtn {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        background: #444;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="exportBtn">Export Registrations</button>

    <div class="flip-container" id="flipContainer">
      <div class="card">
        <div class="card-face front" id="frontFace">
          <h2>Open a Bright Future!</h2>
          <p>Click to register your kids’ accounts!</p>
        </div>
        <div class="card-face back">
          <div class="close-btn" id="closeBtn">&times;</div>
          <form id="regForm">
            <input type="text" name="parent" placeholder="Your Name" required />
            <input
              type="tel"
              name="phone"
              placeholder="Phone Number"
              required
            />
            <input
              type="email"
              name="email"
              placeholder="Email Address"
              required
            />
            <input type="text" name="kids" placeholder="Kids’ Names" required />
            <button type="submit">Submit</button>
          </form>
          <div id="thankYou" style="display: none; text-align: center">
            <h3>Thank You!</h3>
            <p>Registration received.</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Utility: convert array of objects to CSV
      function toCSV(arr) {
        if (!arr.length) return "";
        const headers = Object.keys(arr[0]);
        const rows = arr.map((obj) =>
          headers
            .map((h) => `"${(obj[h] || "").toString().replace(/"/g, '""')}"`)
            .join(",")
        );
        return [headers.join(","), ...rows].join("\r\n");
      }

      // Load or initialize submissions array
      let submissions = JSON.parse(localStorage.getItem("submissions") || "[]");

      // Grab UI elements
      const container = document.getElementById("flipContainer");
      const form = document.getElementById("regForm");
      const closeBtn = document.getElementById("closeBtn");
      const thankYou = document.getElementById("thankYou");
      const exportBtn = document.getElementById("exportBtn");

      // Flip to form on any front click
      container.addEventListener("click", () => {
        if (!container.classList.contains("flipped")) {
          container.classList.add("flipped");
        }
      });

      // Close button flips back
      closeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        container.classList.remove("flipped");
      });

      // Form submission: save, thank-you, then reset & flip back
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const entry = {
          parent: form.parent.value,
          phone: form.phone.value,
          email: form.email.value,
          kids: form.kids.value,
          date: new Date().toISOString(),
        };
        submissions.push(entry);
        localStorage.setItem("submissions", JSON.stringify(submissions));
        form.style.display = "none";
        thankYou.style.display = "block";
        setTimeout(() => {
          container.classList.remove("flipped");
          form.reset();
          form.style.display = "block";
          thankYou.style.display = "none";
        }, 2000);
      });

      // Export button: generate CSV & download
      exportBtn.addEventListener("click", () => {
        const csv = toCSV(submissions);
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "registrations.csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });
    </script>
  </body>
</html>
